<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserva Huaravito LTEMS - Visor 3D Ortorectificado</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #0d1117;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #e6edf3;
      background: rgba(13, 17, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 12px 16px;
      border-radius: 8px;
      pointer-events: none;
      backdrop-filter: blur(10px);
      z-index: 10;
    }
    #hud h1 { margin: 0 0 4px 0; font-size: 1rem; font-weight: 600; }
    #hud p { margin: 0; font-size: 0.75rem; color: #8b949e; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="hud">
    <h1>Reserva Huaravito LTEMS</h1>
    <p>Topografía 3D + Ortofoto Cenital Proyectada</p>
  </div>

  <script>
    const stlBase64 = "TU_CADENA_BASE64_AQUI";

    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, -90, 90);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Iluminación para resaltar el relieve sin lavar los colores de la vegetación
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.6);
    sunLight.position.set(20, -40, 100);
    scene.add(sunLight);

    // Cargar la nueva ortofoto cenital
    const textureLoader = new THREE.TextureLoader();
    // Reemplaza por el nombre exacto de la nueva imagen subida al repo
    const ortofoto = textureLoader.load('ortofoto_cenital.jpg');

    const loader = new THREE.STLLoader();
    const buffer = base64ToArrayBuffer(stlBase64);
    const geometry = loader.parse(buffer);

    // Mapeo Planar UV Nadiral
    geometry.computeBoundingBox();
    const bbox = geometry.boundingBox;
    const sizeX = bbox.max.x - bbox.min.x;
    const sizeY = bbox.max.y - bbox.min.y;

    const pos = geometry.attributes.position;
    const uvs = [];

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const u = (x - bbox.min.x) / sizeX;
      const v = (y - bbox.min.y) / sizeY;
      uvs.push(u, v);
    }

    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geometry.center();

    const material = new THREE.MeshStandardMaterial({
      map: ortofoto,
      roughness: 0.8,
      metalness: 0.05
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
